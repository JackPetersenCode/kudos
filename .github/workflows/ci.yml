name: CI

# Build-checks the deployed services on every push/PR to main so a broken
# build is caught here instead of at Railway (API) / Vercel (web) deploy time.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — .NET build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Kudos.Server/kudos.csproj
      - name: Build (Release)
        run: dotnet build Kudos.Server/kudos.csproj -c Release --no-restore
      # No test step yet — no test project exists. When one is added
      # (e.g. Kudos.Server.Tests), add `dotnet test` here.

  web:
    name: Web — Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kudos.client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kudos.client/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # Dummy values so the build compiles without real secrets; the app
          # reads these at runtime from Vercel env vars, not from CI.
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com/api
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy
